<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moved — Editorial Twin buy</title>
  <meta name="description" content="Multi-SKU Money Brief retired. Buy Editorial Twin at /buy/." />
  <meta http-equiv="refresh" content="2;url=../buy/" />

  <style>
    :root {
      --bg: #0c0e12; --text: #e8ecf4; --muted: #8b95a8;
      --accent: #6ee7b7; --accent2: #93c5fd; --border: #2a3140; --surface: #161a22;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    body {
      margin: 0; min-height: 100dvh; font-family: var(--font);
      background: var(--bg); color: var(--text); line-height: 1.55;
      display: grid; place-items: center; padding: 1.5rem;
    }
    .box {
      width: min(480px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem 1.35rem;
    }
    .badge {
      display: inline-block; font-size: 0.7rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      padding: 0.25rem 0.6rem; border-radius: 999px; margin-bottom: 0.85rem;
    }
    h1 { margin: 0 0 0.65rem; font-size: 1.35rem; }
    p { margin: 0 0 0.85rem; color: var(--muted); font-size: 0.95rem; }
    a { color: var(--accent2); font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <span class="badge">Moved</span>
